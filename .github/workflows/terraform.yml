name: 🏗️ Terraform CI/CD

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform.yml"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

env:
  TF_VERSION: "1.7.5"

  # Azure auth — set in GitHub → Settings → Secrets → Actions
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

  # Sensitive Terraform variables — set these in GitHub → Settings → Secrets → Actions
  TF_VAR_jwt_secret:           ${{ secrets.TF_VAR_JWT_SECRET }}
  TF_VAR_postgres_password:    ${{ secrets.TF_VAR_POSTGRES_PASSWORD }}
  TF_VAR_gemini_api_key:       ${{ secrets.TF_VAR_GEMINI_API_KEY }}
  TF_VAR_azure_ai_key:         ${{ secrets.TF_VAR_AZURE_AI_KEY }}
  TF_VAR_azure_ai_endpoint:    ${{ secrets.TF_VAR_AZURE_AI_ENDPOINT }}

permissions:
  contents: read
  pull-requests: write  # needed to post plan output as PR comment

jobs:
  # ─── Terraform Plan ───────────────────────────────────────────────────────────
  plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exit_code }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: 📦 Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="resource_group_name=aswin-rg" \
            -backend-config="storage_account_name=aegishealthstorage" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=terraform.tfstate" \
            -input=false -no-color

      - name: ✅ Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: 🎨 Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -no-color
        continue-on-error: true

      - name: 📋 Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan \
            -no-color \
            -input=false \
            -detailed-exitcode 2>&1 | tee plan_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # exit code 0 = no changes, 2 = changes present, 1 = error
          [ $EXIT_CODE -eq 1 ] && exit 1 || exit 0

      - name: 💾 Upload plan artifact
        uses: actions/upload-artifact@v4
        if: steps.plan.outputs.exit_code != '1'
        with:
          name: tfplan
          path: tfplan
          retention-days: 5

      # ── Post plan as PR comment ───────────────────────────────────────────────
      - name: 💬 Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('plan_output.txt', 'utf8');
            const truncated = planOutput.length > 60000
              ? planOutput.substring(0, 60000) + '\n\n... (output truncated, see logs for full output)'
              : planOutput;

            const icons = { success: '✅', failure: '❌' };
            const fmtStatus   = icons['${{ steps.fmt.outcome }}']   ?? '⚠️';
            const valStatus   = icons['${{ steps.validate.outcome }}'] ?? '❌';
            const planStatus  = '${{ steps.plan.outputs.exit_code }}' === '0' ? '✅ No changes'
                              : '${{ steps.plan.outputs.exit_code }}' === '2' ? '🔄 Changes pending'
                              : '❌ Error';

            const body = `## 🏗️ Terraform Plan — \`${{ github.head_ref }}\`

            | Step | Status |
            |------|--------|
            | 📦 Init | ✅ Success |
            | ✅ Validate | ${valStatus} |
            | 🎨 Format | ${fmtStatus} |
            | 📋 Plan | ${planStatus} |

            <details>
            <summary>📋 Show Full Plan Output</summary>

            \`\`\`
            ${truncated}
            \`\`\`
            </details>

            > 💡 Merge this PR to trigger **Terraform Apply** automatically.

            *Triggered by @${{ github.actor }} · \`${{ github.sha }}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🏗️ Terraform Plan')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ─── Terraform Apply (push to main only) ─────────────────────────────────────
  apply:
    name: 🚀 Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment:
      name: production   # add manual approval gate in repo Settings → Environments
      url: http://52.140.120.67

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 📦 Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=aswin-rg" \
            -backend-config="storage_account_name=aegishealthstorage" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=terraform.tfstate" \
            -input=false -no-color

      - name: ⬇️ Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: .

      - name: 🚀 Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan

      - name: 📊 Write job summary
        if: always()
        run: |
          echo "## 🚀 Terraform Apply Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          ACR=$(terraform output -raw acr_login_server 2>/dev/null || echo 'see outputs')
          AKS=$(terraform output -raw aks_cluster_name 2>/dev/null || echo 'see outputs')
          KV=$(terraform output -raw key_vault_name 2>/dev/null || echo 'see outputs')
          echo "| **ACR** | $ACR |" >> $GITHUB_STEP_SUMMARY
          echo "| **AKS Cluster** | $AKS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Key Vault** | $KV |" >> $GITHUB_STEP_SUMMARY
          echo "| **Applied by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          terraform output next_steps 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ─── Terraform Destroy (manual trigger only) ─────────────────────────────────
  destroy:
    name: 💣 Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment:
      name: production  # requires manual approval

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 📦 Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=aswin-rg" \
            -backend-config="storage_account_name=aegishealthstorage" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=terraform.tfstate" \
            -input=false -no-color

      - name: 💣 Terraform Destroy
        run: |
          terraform destroy \
            -var-file="terraform.tfvars" \
            -auto-approve \
            -input=false \
            -no-color
